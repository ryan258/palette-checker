<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: var(--figma-color-bg, #ffffff);
        --text: var(--figma-color-text, #111111);
        --muted: var(--figma-color-text-secondary, #666666);
        --border: var(--figma-color-border, #d6d6d6);
        --accent: var(--figma-color-bg-brand, #0d99ff);
        --danger: #d92d20;
        --success: #0f7b0f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 12px/1.45 Inter, ui-sans-serif, system-ui, sans-serif;
      }

      main {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px;
      }

      h1 {
        margin: 0;
        font-size: 18px;
      }

      button {
        min-height: 32px;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: white;
        font-weight: 700;
        cursor: pointer;
      }

      .palette,
      .results {
        display: grid;
        gap: 8px;
      }

      .swatches {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .swatch {
        width: 32px;
        height: 32px;
        border: 1px solid var(--border);
        border-radius: 6px;
      }

      .result {
        display: grid;
        grid-template-columns: 44px 1fr auto;
        gap: 8px;
        align-items: center;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px;
      }

      .sample {
        min-height: 36px;
        border-radius: 6px;
        display: grid;
        place-items: center;
        font-weight: 800;
      }

      .meta {
        color: var(--muted);
      }

      .badge {
        font-weight: 800;
      }

      .pass {
        color: var(--success);
      }

      .fail {
        color: var(--danger);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ChromaCheck</h1>
      <button id="scan" type="button">Scan Selection</button>
      <section class="palette">
        <strong id="summary">No colors scanned</strong>
        <div id="swatches" class="swatches"></div>
      </section>
      <section id="results" class="results"></section>
    </main>

    <script>
      const scanBtn = document.getElementById("scan");
      const summary = document.getElementById("summary");
      const swatches = document.getElementById("swatches");
      const results = document.getElementById("results");

      function hexToRgb(hex) {
        if (!/^#[0-9a-f]{6}$/i.test(hex)) return null;
        return {
          r: parseInt(hex.slice(1, 3), 16) / 255,
          g: parseInt(hex.slice(3, 5), 16) / 255,
          b: parseInt(hex.slice(5, 7), 16) / 255,
        };
      }

      function luminance(hex) {
        const rgb = hexToRgb(hex);
        if (!rgb) return 0;
        const channel = (value) =>
          value <= 0.03928
            ? value / 12.92
            : Math.pow((value + 0.055) / 1.055, 2.4);
        return (
          0.2126 * channel(rgb.r) +
          0.7152 * channel(rgb.g) +
          0.0722 * channel(rgb.b)
        );
      }

      function contrast(fg, bg) {
        const a = luminance(fg);
        const b = luminance(bg);
        return (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05);
      }

      function level(ratio) {
        if (ratio >= 7) return "AAA";
        if (ratio >= 4.5) return "AA";
        if (ratio >= 3) return "AA Large";
        return "Fail";
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          }[char];
        });
      }

      function normalizeHex(value) {
        return typeof value === "string" && /^#[0-9a-f]{6}$/i.test(value)
          ? value.toLowerCase()
          : null;
      }

      function render(colors) {
        const normalizedColors = (Array.isArray(colors) ? colors : [])
          .map(normalizeHex)
          .filter(Boolean);
        summary.textContent = normalizedColors.length
          ? `${normalizedColors.length} solid colors`
          : "No solid colors in the selection";
        swatches.innerHTML = normalizedColors
          .map(
            (hex) =>
              `<div class="swatch" title="${escapeHtml(hex)}" style="background:${hex}"></div>`,
          )
          .join("");

        const rows = [];
        normalizedColors.forEach((fg) => {
          normalizedColors.forEach((bg) => {
            if (fg === bg) return;
            const ratio = contrast(fg, bg);
            const grade = level(ratio);
            rows.push({ fg, bg, ratio, grade });
          });
        });
        rows.sort((a, b) => a.ratio - b.ratio);

        results.innerHTML = rows
          .map(
            (row) => `
              <article class="result">
                <div class="sample" style="color:${row.fg};background:${row.bg};">Aa</div>
                <div>
                  <strong>${escapeHtml(row.fg)} on ${escapeHtml(row.bg)}</strong>
                  <div class="meta">${row.ratio.toFixed(2)}:1</div>
                </div>
                <span class="badge ${row.grade === "Fail" ? "fail" : "pass"}">${escapeHtml(row.grade)}</span>
              </article>
            `,
          )
          .join("");
      }

      scanBtn.addEventListener("click", () => {
        parent.postMessage({ pluginMessage: { type: "scan-selection" } }, "*");
      });

      window.onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message) return;
        if (message.type === "scan-result") {
          render(message.colors || []);
        }
        if (message.type === "selection-change") {
          summary.textContent = `${message.count} selected`;
        }
      };
    </script>
  </body>
</html>
