name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: cli/package-lock.json
      - name: Install CLI dependencies
        run: npm ci --prefix cli
      - name: Syntax check
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -name '*.js' -not -path './cli/node_modules/*' -not -path './.git/*' -not -path './chrome-extension/shared/contrast.esm.js' -print0)
          node --input-type=module --check < chrome-extension/shared/contrast.esm.js
      - name: Extension tests
        run: node --test chrome-extension/tests/*.test.js
      - name: Verify bundle freshness
        run: |
          ./chrome-extension/build.sh
          git diff --exit-code chrome-extension/content/content.js
      - name: CLI tests
        run: npm test --prefix cli
      - name: Figma plugin tests
        run: node --test figma-plugin/code.test.js

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stage web app assets
        run: |
          mkdir _site
          cp index.html script.js styles.css _site/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
